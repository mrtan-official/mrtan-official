<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
<defs>
<style>
@keyframes cw  { from{transform:rotate(0deg)}   to{transform:rotate(360deg)} }
@keyframes ccw { from{transform:rotate(0deg)}   to{transform:rotate(-360deg)} }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
.R1{animation:cw 20s linear infinite;transform-origin:200px 200px}
.R2{animation:ccw 13s linear infinite;transform-origin:200px 200px}
.glow{animation:pulse 2.5s ease-in-out infinite}
.avatar{animation:pulse 4s ease-in-out infinite}
</style>
<filter id="g"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="g2"><feGaussianBlur stdDeviation="1.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<radialGradient id="bg" cx="50%" cy="50%" r="50%">
  <stop offset="0%" stop-color="#0d1117"/>
  <stop offset="100%" stop-color="#0a0f1a"/>
</radialGradient>
<radialGradient id="avbg" cx="50%" cy="50%" r="50%">
  <stop offset="0%" stop-color="#1a2744"/>
  <stop offset="100%" stop-color="#0d1117"/>
</radialGradient>
</defs>

<!-- Background -->
<rect width="400" height="400" fill="url(#bg)" rx="12"/>

<!-- Orbit rings -->
<circle cx="200" cy="200" r="148" fill="none" stroke="#00ff0025" stroke-width="1" stroke-dasharray="4 4"/>
<circle cx="200" cy="200" r="90"  fill="none" stroke="#00ff0018" stroke-width="1" stroke-dasharray="2 6"/>

<!-- Center avatar area -->
<circle cx="200" cy="200" r="72" fill="url(#avbg)"/>
<circle cx="200" cy="200" r="72" fill="none" stroke="#00ff00" stroke-width="2.5" filter="url(#g)" class="glow"/>
<circle cx="200" cy="200" r="68" fill="none" stroke="#00ff0040" stroke-width="1"/>

<!-- MR-TAN text in center -->
<text x="200" y="193" text-anchor="middle" font-size="20" font-family="'Courier New',monospace" fill="#00ff00" font-weight="bold" filter="url(#g2)">MR-TAN</text>
<text x="200" y="210" text-anchor="middle" font-size="8" font-family="'Courier New',monospace" fill="#00ff0099">DEATH CYBER ARMY</text>
<text x="200" y="223" text-anchor="middle" font-size="8" font-family="'Courier New',monospace" fill="#00ff0070">🇧🇩 Bangladesh</text>

<!-- ── OUTER RING (7 icons, 20s CW) ── -->
<g class="R1">

  <!-- Python @0° → (200,52) -->
  <g transform="translate(200,52)" filter="url(#g2)">
    <circle r="22" fill="#1a2a4a"/><circle r="22" fill="none" stroke="#3776AB" stroke-width="2"/>
    <!-- Python logo simplified -->
    <path d="M-6,-9 C-6,-12 -3,-14 0,-14 C3,-14 6,-12 6,-9 L6,-2 C6,1 3,3 0,3 C-3,3 -6,1 -6,-2 Z" fill="#3776AB"/>
    <path d="M-6,9 C-6,12 -3,14 0,14 C3,14 6,12 6,9 L6,2 C6,-1 3,-3 0,-3 C-3,-3 -6,-1 -6,2 Z" fill="#FFD43B"/>
    <circle r="2.5" cx="-1" cy="-6" fill="#FFD43B"/>
    <circle r="2.5" cx="1"  cy="6"  fill="#3776AB"/>
  </g>

  <!-- Bash @51.4° -->
  <g transform="rotate(51.4,200,200) translate(200,52)" filter="url(#g2)">
    <circle r="22" fill="#111"/><circle r="22" fill="none" stroke="#4EAA25" stroke-width="2"/>
    <text y="-2" text-anchor="middle" font-size="15" font-family="monospace" fill="#4EAA25" font-weight="bold">$_</text>
    <text y="10" text-anchor="middle" font-size="7"  font-family="monospace" fill="#4EAA2599">bash</text>
  </g>

  <!-- C @102.8° -->
  <g transform="rotate(102.8,200,200) translate(200,52)" filter="url(#g2)">
    <circle r="22" fill="#00599C"/><circle r="22" fill="none" stroke="#A8B9CC" stroke-width="2"/>
    <text y="8" text-anchor="middle" font-size="22" font-family="Arial" fill="#A8B9CC" font-weight="bold">C</text>
  </g>

  <!-- HTML5 @154.2° -->
  <g transform="rotate(154.2,200,200) translate(200,52)" filter="url(#g2)">
    <circle r="22" fill="#E34F26"/><circle r="22" fill="none" stroke="#F16529" stroke-width="2"/>
    <!-- HTML5 shield shape -->
    <polygon points="0,-13 11,13 0,10 -11,13" fill="#F16529" opacity=".6"/>
    <polygon points="0,-13 0,10 11,13" fill="#EB6228" opacity=".8"/>
    <text y="5" text-anchor="middle" font-size="9" font-family="Arial" fill="white" font-weight="bold">HTML</text>
  </g>

  <!-- Node.js @205.7° -->
  <g transform="rotate(205.7,200,200) translate(200,52)" filter="url(#g2)">
    <circle r="22" fill="#1a3a1a"/><circle r="22" fill="none" stroke="#339933" stroke-width="2"/>
    <text y="-1" text-anchor="middle" font-size="9" font-family="Arial" fill="#8CC84B" font-weight="bold">Node</text>
    <text y="10" text-anchor="middle" font-size="9" font-family="Arial" fill="#339933" font-weight="bold">.js</text>
  </g>

  <!-- MySQL @257.1° -->
  <g transform="rotate(257.1,200,200) translate(200,52)" filter="url(#g2)">
    <circle r="22" fill="#00546B"/><circle r="22" fill="none" stroke="#F29111" stroke-width="2"/>
    <text y="-2" text-anchor="middle" font-size="8" font-family="Arial" fill="#F29111" font-weight="bold">My</text>
    <text y="9"  text-anchor="middle" font-size="8" font-family="Arial" fill="white"   font-weight="bold">SQL</text>
  </g>

  <!-- Linux @308.5° -->
  <g transform="rotate(308.5,200,200) translate(200,52)" filter="url(#g2)">
    <circle r="22" fill="#111"/><circle r="22" fill="none" stroke="#FCC624" stroke-width="2"/>
    <text y="4"  text-anchor="middle" font-size="16" font-family="Arial" fill="#FCC624">🐧</text>
    <text y="14" text-anchor="middle" font-size="6"  font-family="Arial" fill="#FCC62499">Linux</text>
  </g>

</g>

<!-- ── INNER RING (3 icons, 13s CCW) ── -->
<g class="R2">

  <!-- GitHub @0° → (200,110) -->
  <g transform="translate(200,110)" filter="url(#g2)">
    <circle r="17" fill="#161b22"/><circle r="17" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <!-- GitHub octocat simplified -->
    <circle r="7" cx="0" cy="-1" fill="white"/>
    <path d="M-4,5 Q0,10 4,5" fill="none" stroke="white" stroke-width="1.5"/>
    <circle r="1.5" cx="-2.5" cy="-2" fill="#161b22"/>
    <circle r="1.5" cx="2.5"  cy="-2" fill="#161b22"/>
  </g>

  <!-- Kali Linux @120° -->
  <g transform="rotate(120,200,200) translate(200,110)" filter="url(#g2)">
    <circle r="17" fill="#1a1a2e"/><circle r="17" fill="none" stroke="#1793d1" stroke-width="1.5"/>
    <text y="-1" text-anchor="middle" font-size="7.5" font-family="monospace" fill="#1793d1" font-weight="bold">KALI</text>
    <text y="9"  text-anchor="middle" font-size="6"   font-family="monospace" fill="#1793d170">Linux</text>
  </g>

  <!-- Git @240° -->
  <g transform="rotate(240,200,200) translate(200,110)" filter="url(#g2)">
    <circle r="17" fill="#3a1a10"/><circle r="17" fill="none" stroke="#F05032" stroke-width="1.5"/>
    <!-- Git branch icon simplified -->
    <circle r="3" cx="0" cy="-6" fill="#F05032"/>
    <circle r="3" cx="-5" cy="5" fill="#F05032"/>
    <circle r="3" cx="5"  cy="5" fill="#F05032"/>
    <line x1="0" y1="-3" x2="0"  y2="2"  stroke="#F05032" stroke-width="1.5"/>
    <line x1="0" y1="2"  x2="-5" y2="5"  stroke="#F05032" stroke-width="1.5"/>
    <line x1="0" y1="2"  x2="5"  y2="5"  stroke="#F05032" stroke-width="1.5"/>
  </g>

</g>

<!-- Corner decorations -->
<circle cx="200" cy="52"  r="2" fill="#00ff00" opacity="0.6"/>
<circle cx="348" cy="200" r="2" fill="#00ff00" opacity="0.4"/>
<circle cx="200" cy="348" r="2" fill="#00ff00" opacity="0.6"/>
<circle cx="52"  cy="200" r="2" fill="#00ff00" opacity="0.4"/>

</svg>
