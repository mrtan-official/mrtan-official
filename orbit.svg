<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
<defs>
<style>
@keyframes cw  { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
@keyframes ccw { from{transform:rotate(0deg)} to{transform:rotate(-360deg)} }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
.R1{animation:cw  22s linear infinite;transform-origin:250px 250px}
.R2{animation:ccw 14s linear infinite;transform-origin:250px 250px}
.gl{animation:pulse 3s ease-in-out infinite}
</style>
<filter id="g"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="g2"><feGaussianBlur stdDeviation="1.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<radialGradient id="bg" cx="50%" cy="50%" r="50%">
  <stop offset="0%" stop-color="#0d1117"/>
  <stop offset="100%" stop-color="#060a10"/>
</radialGradient>
</defs>

<rect width="500" height="500" fill="url(#bg)" rx="16"/>

<!-- Orbit rings -->
<circle cx="250" cy="250" r="185" fill="none" stroke="#00ff0022" stroke-width="1.2" stroke-dasharray="5 5"/>
<circle cx="250" cy="250" r="112" fill="none" stroke="#00ff0018" stroke-width="1" stroke-dasharray="3 7"/>

<!-- Center hole - transparent so profile pic shows through -->
<circle cx="250" cy="250" r="95" fill="#0d1117"/>
<circle cx="250" cy="250" r="95" fill="none" stroke="#00ff00" stroke-width="2.5" filter="url(#g)" class="gl"/>
<circle cx="250" cy="250" r="90" fill="none" stroke="#00ff0030" stroke-width="1"/>

<!-- ── OUTER RING 7 icons 22s CW ── -->
<g class="R1">

  <!-- Python 0° -->
  <g transform="translate(250,65)" filter="url(#g2)">
    <circle r="24" fill="#1a2a4a"/><circle r="24" fill="none" stroke="#3776AB" stroke-width="2.5"/>
    <path d="M-7,-10 C-7,-14 -3.5,-16 0,-16 C3.5,-16 7,-14 7,-10 L7,-2 C7,2 3.5,4 0,4 C-3.5,4 -7,2 -7,-2Z" fill="#3776AB"/>
    <path d="M-7,10 C-7,14 -3.5,16 0,16 C3.5,16 7,14 7,10 L7,2 C7,-2 3.5,-4 0,-4 C-3.5,-4 -7,-2 -7,2Z" fill="#FFD43B"/>
    <circle r="3" cx="-1" cy="-7" fill="#FFD43B"/>
    <circle r="3" cx="1"  cy="7"  fill="#3776AB"/>
  </g>

  <!-- Bash 51.4° -->
  <g transform="rotate(51.4,250,250) translate(250,65)" filter="url(#g2)">
    <circle r="24" fill="#0d1117"/><circle r="24" fill="none" stroke="#4EAA25" stroke-width="2.5"/>
    <rect x="-13" y="-12" width="26" height="18" rx="2" fill="#1a2a1a"/>
    <text y="-2"  text-anchor="middle" font-size="8"  font-family="monospace" fill="#4EAA25">#!/bin</text>
    <text y="8"   text-anchor="middle" font-size="11" font-family="monospace" fill="#4EAA25" font-weight="bold">$_</text>
  </g>

  <!-- C 102.8° -->
  <g transform="rotate(102.8,250,250) translate(250,65)" filter="url(#g2)">
    <circle r="24" fill="#00599C"/><circle r="24" fill="none" stroke="#A8B9CC" stroke-width="2.5"/>
    <text y="9" text-anchor="middle" font-size="24" font-family="Arial" fill="#A8B9CC" font-weight="bold">C</text>
  </g>

  <!-- HTML5 154.2° -->
  <g transform="rotate(154.2,250,250) translate(250,65)" filter="url(#g2)">
    <circle r="24" fill="#E34F26"/><circle r="24" fill="none" stroke="#F16529" stroke-width="2.5"/>
    <polygon points="0,-15 13,15 0,11 -13,15" fill="#F16529" opacity=".5"/>
    <polygon points="0,-15 0,11 13,15" fill="#c0390f" opacity=".7"/>
    <text y="6" text-anchor="middle" font-size="9.5" font-family="Arial" fill="white" font-weight="bold">HTML5</text>
  </g>

  <!-- Node.js 205.7° -->
  <g transform="rotate(205.7,250,250) translate(250,65)" filter="url(#g2)">
    <circle r="24" fill="#1a3a1a"/><circle r="24" fill="none" stroke="#339933" stroke-width="2.5"/>
    <text y="-1" text-anchor="middle" font-size="10" font-family="Arial" fill="#8CC84B" font-weight="bold">Node</text>
    <text y="11" text-anchor="middle" font-size="10" font-family="Arial" fill="#339933" font-weight="bold">.js</text>
  </g>

  <!-- MySQL 257.1° -->
  <g transform="rotate(257.1,250,250) translate(250,65)" filter="url(#g2)">
    <circle r="24" fill="#00546B"/><circle r="24" fill="none" stroke="#F29111" stroke-width="2.5"/>
    <text y="-2" text-anchor="middle" font-size="9"  font-family="Arial" fill="#F29111" font-weight="bold">My</text>
    <text y="10" text-anchor="middle" font-size="9"  font-family="Arial" fill="white"   font-weight="bold">SQL</text>
  </g>

  <!-- Linux 308.5° -->
  <g transform="rotate(308.5,250,250) translate(250,65)" filter="url(#g2)">
    <circle r="24" fill="#111"/><circle r="24" fill="none" stroke="#FCC624" stroke-width="2.5"/>
    <text y="5"  text-anchor="middle" font-size="18" font-family="Arial" fill="#FCC624">🐧</text>
    <text y="16" text-anchor="middle" font-size="6.5" font-family="Arial" fill="#FCC62499">Linux</text>
  </g>

</g>

<!-- ── INNER RING 3 icons 14s CCW ── -->
<g class="R2">

  <!-- GitHub 0° -->
  <g transform="translate(250,138)" filter="url(#g2)">
    <circle r="18" fill="#161b22"/><circle r="18" fill="none" stroke="#e0e0e0" stroke-width="2"/>
    <circle r="7.5" cx="0" cy="-1" fill="#e0e0e0"/>
    <path d="M-4.5,6 Q0,12 4.5,6" fill="none" stroke="#e0e0e0" stroke-width="2"/>
    <circle r="1.8" cx="-2.8" cy="-2.5" fill="#161b22"/>
    <circle r="1.8" cx="2.8"  cy="-2.5" fill="#161b22"/>
  </g>

  <!-- Kali 120° -->
  <g transform="rotate(120,250,250) translate(250,138)" filter="url(#g2)">
    <circle r="18" fill="#1a1a2e"/><circle r="18" fill="none" stroke="#1793d1" stroke-width="2"/>
    <text y="-1" text-anchor="middle" font-size="8" font-family="monospace" fill="#1793d1" font-weight="bold">KALI</text>
    <text y="9"  text-anchor="middle" font-size="6" font-family="monospace" fill="#1793d199">Linux</text>
  </g>

  <!-- Git 240° -->
  <g transform="rotate(240,250,250) translate(250,138)" filter="url(#g2)">
    <circle r="18" fill="#2a0f08"/><circle r="18" fill="none" stroke="#F05032" stroke-width="2"/>
    <circle r="3.5" cx="0"  cy="-7" fill="#F05032"/>
    <circle r="3.5" cx="-6" cy="6"  fill="#F05032"/>
    <circle r="3.5" cx="6"  cy="6"  fill="#F05032"/>
    <line x1="0" y1="-3.5" x2="0"  y2="2.5" stroke="#F05032" stroke-width="2"/>
    <line x1="0" y1="2.5"  x2="-6" y2="6"   stroke="#F05032" stroke-width="2"/>
    <line x1="0" y1="2.5"  x2="6"  y2="6"   stroke="#F05032" stroke-width="2"/>
  </g>

</g>

<!-- Pulse dots on rings -->
<circle cx="250" cy="65"  r="2.5" fill="#00ff00" opacity=".7"/>
<circle cx="435" cy="250" r="2.5" fill="#00ff00" opacity=".4"/>
<circle cx="250" cy="435" r="2.5" fill="#00ff00" opacity=".7"/>
<circle cx="65"  cy="250" r="2.5" fill="#00ff00" opacity=".4"/>

</svg>
